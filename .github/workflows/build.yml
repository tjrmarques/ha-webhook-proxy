name: Build and publish

on:
  push:
    branches: [main]
    paths:
      - "webhook_proxy/**"
      - "cloudflared/**"
      - ".github/workflows/build.yml"
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        component:
          - name: webhook_proxy
            image: webhook-proxy
          - name: cloudflared
            image: ha-cloudflared
        arch_info:
          - arch: amd64
            platform: linux/amd64
            build_from: ghcr.io/home-assistant/amd64-base:3.19
          - arch: aarch64
            platform: linux/arm64
            build_from: ghcr.io/home-assistant/aarch64-base:3.19
          - arch: armv7
            platform: linux/arm/v7
            build_from: ghcr.io/home-assistant/armv7-base:3.19

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Read app version
        id: version
        run: |
          VERSION=$(grep '^version:' "${{ matrix.component.name }}/config.yaml" | sed 's/version: *"\(.*\)"/\1/')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.component.name }}
          platforms: ${{ matrix.arch_info.platform }}
          build-args: |
            BUILD_FROM=${{ matrix.arch_info.build_from }}
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/${{ matrix.component.image }}-${{ matrix.arch_info.arch }}:${{ steps.version.outputs.version }}
            ghcr.io/${{ github.repository_owner }}/${{ matrix.component.image }}-${{ matrix.arch_info.arch }}:latest
